<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div class="flex items-center justify-center bg-gray-100">
    <div class="space-y-6 text-center bg-white p-8 rounded-lg shadow-lg w-full max-w-8xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-800">Fakulteti</h1>
        <h2 class="text-3xl font-semibold text-gray-600">AOP Univerziteta</h2>
    </div>
  </div>
  <mat-tab-group class="p-4 bg-gray-100">
    <mat-tab *ngFor="let fakultet of fakulteti" label="{{fakultet.naziv}}" class="bg-white shadow-md rounded-lg">
      <mat-tab-group>
        <mat-tab *ngFor="let studijskiProgram of fakultet.studijskiProgrami" label="{{studijskiProgram.naziv}}" class="bg-white shadow-md rounded-lg">
          <ul class="p-6 space-y-4">
            <li *ngFor="let godina of getUniqueGodine(studijskiProgram.godineStudija ?? [])" class="border-b bg-gray-100 border-gray-200 pb-4 px-96">
              <h4 class="font-semibold text-gray-800 text-lg mb-2">Godina : {{godina.godina}}</h4>
              <ul class="space-y-2">
                <li *ngFor="let predmet of getFilteredPredmeti(godina, studijskiProgram); let i = index" class="flex items-center justify-between">
                  <span class="text-gray-700">{{i + 1}}. {{predmet.naziv}}</span>
                  <br>
                  <!-- Uncomment and style the button as needed -->
                  <!-- <button class="bg-[#8f7a99] text-white px-4 py-2 rounded-full font-thin hover:bg-purple-800 transition-colors duration-200" (click)="onSilabusButtonClick(predmet.id!, predmet.naziv!)">
                    Silabus
                  </button> -->
                </li>
              </ul>
            </li>
          </ul>
        </mat-tab>
      </mat-tab-group>
    </mat-tab>
  </mat-tab-group>
