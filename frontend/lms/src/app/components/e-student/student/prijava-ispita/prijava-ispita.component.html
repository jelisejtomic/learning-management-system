<div class="flex-1">
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="akronim">
          <th mat-header-cell *matHeaderCellDef> Akronim </th>
          <td mat-cell *matCellDef="let element"> {{element["akronim"]}} </td>
        </ng-container>
        <ng-container matColumnDef="naziv">
          <th mat-header-cell *matHeaderCellDef> Naziv </th>
          <td mat-cell *matCellDef="let element"> {{element["naziv"]}} </td>
        </ng-container>
        <ng-container matColumnDef="espb">
          <th mat-header-cell *matHeaderCellDef> ESPB </th>
          <td mat-cell *matCellDef="let element"> {{element["espb"]}} </td>
        </ng-container>
        <ng-container matColumnDef="obavezan">
          <th mat-header-cell *matHeaderCellDef> Obavezan </th>
          <td mat-cell *matCellDef="let element"> {{element["obavezan"] == true ? "Da" : "Ne"}} </td>
        </ng-container>
        
  
        <ng-container matColumnDef="prijavaIspita">
          <th mat-header-cell *matHeaderCellDef> Prijava ispita </th>
          <td mat-cell *matCellDef="let element">
            <div class="w-full flex">
                <button class="bg-[#8f7a99] text-center text-white font-thin px-4 py-2 rounded-full font-bold hover:bg-purple-800 transition-colors duration-200 grow" (click)="openPopup(); setData(element)">
                    Prijavi
                </button>
            </div>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons
        aria-label="Select page of periodic elements">
      </mat-paginator>
    </div>
  
  
  </div>
