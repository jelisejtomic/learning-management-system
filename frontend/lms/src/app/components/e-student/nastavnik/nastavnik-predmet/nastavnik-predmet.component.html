<div class="flex-1">
    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="predmet">
                <th mat-header-cell *matHeaderCellDef> Predmet </th>
                <td mat-cell *matCellDef="let realizacija">
                    <a [routerLink]="['/predmeti', realizacija.realizacijaPredmeta?.predmet?.id]"
                        class="text-blue-600 hover:text-blue-800 transition-colors duration-300">
                        {{ realizacija.realizacijaPredmeta?.predmet?.naziv }}
                    </a>
                </td>
            </ng-container>

            <ng-container matColumnDef="brojCasova">
                <th mat-header-cell *matHeaderCellDef> Broj časova </th>
                <td mat-cell *matCellDef="let realizacija"> {{realizacija.brojCasova}} </td>
            </ng-container>

            <ng-container matColumnDef="godinaIzvodjenja">
                <th mat-header-cell *matHeaderCellDef> Godina izvodjenja </th>
                <td mat-cell *matCellDef="let realizacija"> {{realizacija.realizacijaPredmeta?.godinaIzvodjenja}} </td>
            </ng-container>

            <ng-container matColumnDef="tipNastave">
                <th mat-header-cell *matHeaderCellDef> Tip nastave </th>
                <td mat-cell *matCellDef="let realizacija"> {{realizacija.tipNastave?.naziv}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
