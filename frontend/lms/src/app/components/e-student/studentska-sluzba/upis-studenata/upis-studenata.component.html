<form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="max-w-lg mx-auto p-4 border rounded shadow-md">
  <div class="mb-4">
    <label for="korisnik" class="block text-gray-700 font-bold mb-2">Korisnik</label>
    <select id="korisnik" formControlName="korisnik" class="w-full p-2 border rounded">
      <option *ngFor="let korisnik of korisniciWithoutRoles" [ngValue]="korisnik">
        {{ korisnik.ime }} {{ korisnik.prezime }}
      </option>
    </select>
  </div>

  <div class="mb-4">
    <label for="jmbg" class="block text-gray-700 font-bold mb-2">JMBG</label>
    <input id="jmbg" formControlName="jmbg" type="text" maxlength="13" class="w-full p-2 border rounded">
  </div>

  <div class="mb-4">
    <label for="datumRodjenja" class="block text-gray-700 font-bold mb-2">Datum Rođenja</label>
    <input id="datumRodjenja" formControlName="datumRodjenja" type="date" class="w-full p-2 border rounded">
  </div>

  <button type="submit" class="bg-[#8f7a99] text-white px-4 py-2 rounded-full font-bold hover:bg-purple-800 transition-colors duration-200">
    Submit
  </button>
</form>


<form [formGroup]="studentNaGodiniForm" (ngSubmit)="dodajStudentaNaGodinu()" class="max-w-lg mx-auto p-4 border rounded shadow-md">
  <div>
    <label for="student">Student</label>
    <select id="student" formControlName="student" class="w-full p-2 border rounded" required>
      <option *ngFor="let student of filteredStudenti" [ngValue]="student">
        {{ student.korisnik?.ime }} {{ student.korisnik?.prezime }}
      </option>
    </select>
  </div>

  <div>
    <label for="brojIndeksa" class="block text-gray-700 font-bold mb-2">Broj Indeksa</label>
    <input id="brojIndeksa" formControlName="brojIndeksa" type="text" class="w-full p-2 border rounded" required>
  </div>

  <div>
    <label for="godinaStudija" class="block text-gray-700 font-bold mb-2">Godina Studija</label>
    <select id="godinaStudija" formControlName="godinaStudija" class="w-full p-2 border rounded"  required>
      <option *ngFor="let godina of godineStudija" [ngValue]="godina">
        {{ godina.godina }}. {{godina.studijskiProgram?.naziv}} {{godina.studijskiProgram?.fakultet?.naziv}}
      </option>
    </select>
  </div>

  <button type="submit" class="bg-[#8f7a99] text-white px-4 py-2 rounded-full font-bold hover:bg-purple-800 transition-colors duration-200">Dodaj studenta na godinu</button>
</form>
